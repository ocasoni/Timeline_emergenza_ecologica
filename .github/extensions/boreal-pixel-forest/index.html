oresta abbattuti per un nuovo data center: una superficie equivalente a circa 460 campi da calcio. Il sito si trova a circa 400 metri dal fiume Oulujoki, che alimenta le città vicine.\n\nOTANMÄKI\nCirca 150.000 alberi abbattuti, secondo la stima dell’ecologa Mari Annala. Il secondo sito è situato a circa 100 km a sud-est di Muhos.\n\nPROCEDURA AMBIENTALE E SOSPENSIONE\nI tagli sono stati eseguiti prima del completamento della valutazione d’impatto ambientale obbligatoria. L’autorità finlandese è intervenuta chiedendo la sospensione dei lavori; Google ha sospeso le attività preparatorie nei due siti e ha presentato le proprie scuse.\n\nQUADRO DELL’INVESTIMENTO\nGli interventi rientrano nel piano da 13 miliardi di euro annunciato da Google per l’espansione delle infrastrutture digitali e di intelligenza artificiale in Finlandia.","image":"data:image/jpeg;base64,/9j/2wBDAAsLCwsLCwwNDQwREhASERgWFBQWGCUaHBocGiU4IykjIykjODI8MS4xPDJZRj4+RllnVlJWZ31wcH2dlZ3Nzf//2wBDAQsLCwsLCwwNDQwREhASERgWFBQWGCUaHBocGiU4IykjIykjODI8MS4xPDJZRj4+RllnVlJWZ31wcH2dlZ3Nzf//wgARCAERAeoDASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAwQAAgUGAQf/xAAZAQEBAQEBAQAAAAAAAAAAAAAAAQIDBAX/2gAMAwEAAhADEAAAAPp/op1wXwcCQUC+D8CwXoT0UCwcgkHKvKeBIPwJBwJBQLBeBoGBoGBYLwNAxDQMDQMDQEDwMDQPoaBimgoFg5BIOBIOBIOBJSF5SF5Tw4yZT3o5HsiwErYCFitVeviqnT+8vaOmtzcOkJxsOz842p2nnG1jufeFqvdTg/DvvfnA0+mz5uI+nz5mBPqc+UaS/Sa/MPE+oz5hc+lz5p4fTp8x9PqHny6H1Dz5hD6f78wOn0mvzuh9Gr87LX0CvB+HfW+f+H0Cvz+H0KfPjndX+fWO8nA2CRaY9GkHM9RjwFVf8VhpkyxxqTLsavmT4ao80g8urUcUKyJC0qSqxpiMym6qmb7q1XLmq+nPToiS8xTq/Tjx9jauRnWvHCV+g+Hzyn0L0+dT6OmnCzvYcCTt/Dib9mKOQp1oTmpugMmzq6CtLEt74k9p6ugxUc6+B88ssMbgI1RJatKhTiSXSsi0W8tVGKjZUQrrmmQOhKqtskMkr7hlruSCnyPZdauCsnR056h1ZeQPZ20+eQ7sPBH1PoV/nIj6EPgdM6i/K+HQh50mbpBTtmr1aXVNny9SIRNIZtjUwrvGMsnQ2OLBs5yhIWiRmxBNsDB4GvsPDz/K20QrG7nCTG9PAvL0wcRM7XPwCo9fJXrYEoJX2cy0aOZUZfxVXN1fEL0RJ9oyL7BTGPtEjHLqNLie9A4c2XTYlxLvZ9GEDRsLr5lLneQU2jEFriE2q+DJ0Xiy7SZzNFIMhKCSnnl18HoAEmCisV0bPS4JzwWYGSVdjxYfvmmHAFgNXVBWePeCYttmgo5VQdEr4mqgZ6sklhyvhH5A     document.querySelector('#tooltip-title').textContent=m.event.short;
    for(const id of previewIds){
      if(id===preview)continue;
      const neighbor=byId.get(id),item=getLinkedTooltip(id);
      item.year.textContent=neighbor.event.date;item.title.textContent=neighbor.event.short;
      item.card.style.setProperty('--band-color',bands[neighbor.event.band].color);
      item.card.hidden=false;
    }
  }
  updateConnections();
}
function updateConnections(){
  const preview=hoveredId||focusedId;
  for(const edge of connectionLines){
    const a=byId.get(edge.from),b=byId.get(edge.to);
    const related=edge.from===preview||edge.to===preview;
    const show=a&&b&&a.visible&&b.visible;
    edge.line.style.display=show?'':'none';
    edge.line.style.opacity=preview?(related?'1':'.16'):'.6';
    if(!show)continue;
    const dx=b.screenX-a.screenX,dy=b.screenY-a.screenY;
    const length=Math.hypot(dx,dy)||1,trim=Math.min(8,length/2);
    edge.line.setAttribute('x1',a.screenX+dx/length*trim);
    edge.line.setAttribute('y1',a.screenY+dy/length*trim);
    edge.line.setAttribute('x2',b.screenX-dx/length*trim);
    edge.line.setAttribute('y2',b.screenY-dy/length*trim);
  }
  layoutTooltips(preview);
}
function layoutTooltips(preview){
  if(!preview)return;
  const occupied=[],padding=12,gap=15;
  if(!panel.hidden){const r=panel.getBoundingClientRect();occupied.push({x:r.left,y:r.top,w:r.width,h:r.height});}
  for(const id of previewIds){
    const marker=byId.get(id),card=id===preview?tooltip:linkedTooltips.get(id).card;
    card.hidden=!marker.visible;
    if(!marker.visible)continue;
    const rect=card.getBoundingClientRect(),w=rect.width,h=rect.height;
    const px=marker.screenX,py=marker.screenY;
    const candidates=[
      [px+gap,py-h/2],[px-w-gap,py-h/2],
      [px-w/2,py-h-gap],[px-w/2,py+gap],
      [px+gap,py-h-gap],[px-w-gap,py-h-gap],
      [px+gap,py+gap],[px-w-gap,py+gap]
    ];
    const boxes=candidates.map(([x,y])=>({x:Math.max(padding,Math.min(viewportWidth-w-padding,x)),y:Math.max(padding,Math.min(viewportHeight-h-padding,y)),w,h}));
    const overlap=box=>occupied.reduce((sum,b)=>sum+Math.max(0,Math.min(box.x+w+6,b.x+b.w)-Math.max(box.x-6,b.x))*Math.max(0,Math.min(box.y+h+6,b.y+b.h)-Math.max(box.y-6,b.y)),0);
    let chosen=boxes[0],score=overlap(chosen);
    for(const box of boxes.slice(1)){const next=overlap(box);if(next<score){chosen=box;score=next;}if(score===0)break;}
    card.style.transform='translate('+chosen.x+'px,'+chosen.y+'px)';occupied.push(chosen);
  }
}
function openEvent(m){const e=m.event,b=bands[e.band];selectedId=e.id;lastOpenedPin=m.hit;panel.style.setProperty('--band-color',b.color);document.querySelector('#detail-band').textContent=b.title;document.querySelector('#detail-date').textContent=e.date+' · '+e.place;document.querySelector('#detail-title').textContent=e.title;const text=document.querySelector('#detail-text');text.textContent=e.description;text.hidden=!e.description;const figure=document.querySelector('#detail-figure'),image=document.querySelector('#detail-image');figure.hidden=!e.image;if(e.image){image.src=e.image;image.alt=e.title;}else{image.removeAttribute('src');image.alt='';}let sourceBox=document.querySelector('#detail-sources');if(!sourceBox){sourceBox=document.createElement('div');sourceBox.id='detail-sources';panel.append(sourceBox);}sourceBox.replaceChildren();sourceBox.hidden=!e.sources?.length;for(const source of e.sources||[]){const link=document.createElement('a');link.href=source.url;link.textContent=source.label;link.target='_blank';link.rel='noopener noreferrer';link.style.cssText='display:block;margin-top:9px;color:#375c44;font-size:11px;line-height:1.5';sourceBox.append(link);}panel.hidden=false;panel.scrollTop=0;hoveredId=null;focusedId=null;syncFocus();closeButton.focus({preventScroll:true});}
function closeEvent(restoreFocus=true){panel.hidden=true;selectedId=null;hoveredId=null;focusedId=null;if(restoreFocus&&lastOpenedPin)lastOpenedPin.focus({preventScroll:true});syncFocus();}

function hideForestTooltip(){forestTooltip.hidden=true;container.classList.remove('forest-focus');}
function showForestTooltip(entry,cx,cy){
 tooltip.hidden=true;for(const item of linkedTooltips.values())item.card.hidden=true;

 container.classList.add('forest-focus');
 forestTooltip.textContent=entry.label+'\nMuhos e Otanmäki · siti Google\n\nDensità illustrativa, senza equivalenza albero/ettari. Clicca per dati e fonti.';
 forestTooltip.hidden=false;

function makeForestTargets(){
 for(let i=0;i<forestSnapshots.length;i++){
  const entry=forestSnapshots[i];
  const hit=svg('polygon',{class:'forest-hit',fill:'transparent',tabindex:0,role:'button','aria-label':entry.label+'. Apri dati e fonti sui tagli a Muhos e Otanmäki','aria-controls':'event-detail'});

  hit.addEventListener('pointerenter',e=>{if(e.pointerType==='touch')return;showForestTooltip(entry,e.clientX,e.clientY);});
  hit.addEventListener('pointermove',e=>showForestTooltip(entry,e.clientX,e.clientY));
  hit.addEventListener('pointerleave',()=>{if(focusedForest!==entry.year)hideForestTooltip();});
  hit.addEventListener('focus',()=>{focusedForest=entry.year;const target=forestTargets[i];showForestTooltip(entry,target.screenX,target.screenY);});

  hit.addEventListener('click',open);
  hit.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
 }
}
function updateForestTargets(scale,offsetX,offsetY){
 for(const item of forestTargets){
  const center=item.index/7*1070,half=1070/14;
  const points=[projection(center-half,665,103),projection(center+half,665,103),projection(center+half,515,0),projection(center-half,515,0)];
  item.hit.setAttribute('points',points.map(p=>(offsetX+p.x*scale)+','+(offsetY+p.y*scale)).join(' '));

 }
 if(focusedForest!==null){const item=forestTargets.find(t=>t.entry.year===focusedForest);showForestTooltip(item.entry,item.screenX,item.screenY);}
}

const peopleTargets=[];
function makePeopleTargets(){
 for(const item of peoplePositions){
  const hit=svg('circle',{class:'people-hit',r:8,fill:'transparent',tabindex:-1,role:'button','aria-label':'Popolazione mondiale, '+item.year+'. Apri dati demografici.','aria-controls':'event-detail'});
  const title=svg('title');title.textContent='Popolazione mondiale · '+item.year+' · clic per dati e scala';hit.append(title);
  peopleTargetLayer.append(hit);peopleTargets.push({item,hit});
  hit.addEventListener('click',()=>openPopulation(hit));
 }
 // One keyboard stop per year avoids hundreds of repeated tab stops.
 for(const entry of populationSnapshots){const target=peopleTargets.find(t=>t.item.year===entry.year);target.hit.setAttribute('tabindex',0);target.hit.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openPopulation(target.hit);}});}
}
function openPopulation(hit){openEvent({event:populationDetail,hit});}
function updatePeopleTargets(scale,offsetX,offsetY){for(const{item,hit}of peopleTargets){hit.setAttribute('cx',offsetX+item.x*scale);hit.setAttribute('cy',offsetY+item.y*scale);}}

// Aste e pin si trovano tra un separè e il successivo.
const stemLayer=svg('g',{'aria-hidden':'true',class:'stem-layer'});
overlay.append(stemLayer);
function makeEvents(){
 const counts=[0,0,0];
 for(const event of ecologicalEvents){
  const band=bands[event.band],index=counts[event.band]++;
  const t=yearToT(event.year),depth=band.depth+[38,76,112][index%3];
  const base=projection(t,depth),top=projection(t,depth,band.height);
  const stem=svg('line',{class:'event-stem',stroke:band.color});stemLayer.append(stem);
  const group=svg('g',{class:'pin-group','data-event-id':event.id});
  const halo=svg('circle',{class:'pin-halo',r:10,stroke:band.color});
  const dot=svg('circle',{class:'pin-dot',r:5,fill:band.color});
  const hit=svg('circle',{class:'pin-hit',r:14,fill:'transparent',tabindex:0,role:'button','aria-label':event.date+' — '+event.short,'aria-controls':'event-detail','aria-expanded':'false','aria-describedby':'event-tooltip'});
  group.append(halo,dot,hit);overlay.append(group);
  const marker={event,group,halo,dot,hit,stem,base,top,depth,screenX:0,screenY:0,visible:true};
  markers.push(marker);byId.set(event.id,marker);
  hit.addEventListener('click',()=>openEvent(marker));
  hit.addEventListener('pointerenter',e=>{if(e.pointerType==='touch')return;hoveredId=event.id;focusedId=null;syncFocus();});
  hit.addEventListener('pointerleave',()=>{if(hoveredId===event.id)hoveredId=null;syncFocus();});
  hit.addEventListener('focus',()=>{focusedId=event.id;syncFocus();});
  hit.addEventListener('blur',()=>{if(focusedId===event.id)focusedId=null;syncFocus();});
  hit.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openEvent(marker);}});
 }
}
function resize(){
 viewportWidth=Math.max(1,container.clientWidth);viewportHeight=Math.max(1,container.clientHeight);
 overlay.setAttribute('viewBox','0 0 '+viewportWidth+' '+viewportHeight);
 const scale=Math.min(viewportWidth/1820,viewportHeight/960);
 const offsetX=(viewportWidth-1820*scale)/2+220*scale,offsetY=(viewportHeight-960*scale)/2;
 for(const m of markers){
  m.screenX=offsetX+m.top.x*scale;m.screenY=offsetY+m.top.y*scale;
  const bx=offsetX+m.base.x*scale;
  const by=offsetY+m.base.y*scale;
  m.stem.setAttribute('x1',bx);m.stem.setAttribute('y1',by);m.stem.setAttribute('x2',m.screenX);m.stem.setAttribute('y2',m.screenY);
  for(const n of[m.halo,m.dot,m.hit]){n.setAttribute('cx',m.screenX);n.setAttribute('cy',m.screenY);}
 }
 updateConnections();
 updateForestTargets(scale,offsetX,offsetY);
 updateFaunaTargets(scale,offsetX,offsetY);
 updatePeopleTargets(scale,offsetX,offsetY);
}
makeEvents();makeForestTargets();makeFaunaTargets();makePeopleTargets();resize();syncFocus();
window.addEventListener('resize',resize);
if(document.fonts)document.fonts.ready.then(()=>resize());
