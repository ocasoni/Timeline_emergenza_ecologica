*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:white;font-family:Inter,Arial,sans-serif;color:#202626}
#visualization{position:relative;width:100%;height:100%;overflow:hidden;cursor:grab;touch-action:none}#visualization.dragging{cursor:grabbing}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;transition:opacity .18s ease}#visualization.has-focus #scene{opacity:.48}
#labels{position:absolute;inset:0;pointer-events:none}.year{font:400 100px/1 Inter,Arial,sans-serif;letter-spacing:-.035em;font-variant-numeric:tabular-nums;white-space:nowrap;user-select:none}
.band-title {
  width: 850px;
  color: #111111;
  font-family: "Inter", sans-serif;
  font-size: 130px;
  font-weight: 400;
  line-height: 1.08;
  text-align: left;
  white-space: nowrap;
}
#event-overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:hidden}.pin-hit{pointer-events:all;cursor:pointer;outline:none}.pin-dot{pointer-events:none;stroke:#fff;stroke-width:1.5}.pin-group:focus-within .pin-dot{stroke:#26343a;stroke-width:2}.event-link{stroke:#000000;stroke-width:1.6;fill:none;pointer-events:none}.pin-halo{pointer-events:none;fill:none;stroke-width:1.5;opacity:0}
.event-tooltip{position:fixed;left:0;top:0;width:246px;max-width:calc(100vw - 24px);padding:12px 14px;background:#fff;border:1px solid #e5e8e9;border-left:4px solid var(--band-color,#909698);border-radius:8px;box-shadow:0 5px 20px #15273118;z-index:20;pointer-events:none}
.event-tooltip[hidden],#event-detail[hidden],#load-error[hidden]{display:none}.tooltip-year{margin-bottom:5px;color:#59666c;font-size:11px;font-weight:500;letter-spacing:.02em}.tooltip-title{font-size:13px;line-height:1.4;font-weight:500;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;text-align:left}
#event-detail{position:fixed;left:24px;top:24px;width:min(370px,calc(100vw - 48px));max-height:calc(100dvh - 48px);overflow:auto;background:#fff;border:1px solid #e1e5e6;border-left:5px solid var(--band-color);border-radius:11px;box-shadow:0 10px 45px #19323e22;padding:23px;z-index:30;touch-action:pan-y}
#detail-close{position:absolute;right:10px;top:10px;border:0;background:#f3f5f5;width:32px;height:32px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer;color:#495658}#detail-close:focus-visible{outline:2px solid #465c65;outline-offset:2px}
#detail-band{font-size:10px;text-transform:uppercase;letter-spacing:.09em;padding-right:26px;color:#627075;line-height:1.5}#detail-date{margin:15px 0 8px;font-size:11px;color:#617075}#detail-title{font-size:21px;line-height:1.25;letter-spacing:-.025em;font-weight:500;margin:0 0 16px}#detail-text{font-size:13px;line-height:1.65;white-space:pre-line;margin:16px 0 0}#detail-figure{margin:0}#detail-image{display:block;width:100%;max-height:230px;object-fit:contain;object-position:left center;background:#f8f8f7;border-radius:5px}#detail-caption{font-size:10px;line-height:1.4;color:#7c8587;margin-top:7px}
#load-error{position:fixed;left:24px;bottom:24px;z-index:50;max-width:390px;padding:15px 18px;background:#fff8ef;border:1px solid #dfc8a5;border-radius:8px;font-size:13px;line-height:1.5}
@media(max-width:600px){#event-detail{top:14px;left:14px;width:calc(100vw - 28px);max-height:calc(100dvh - 28px);padding:20px}.event-tooltip{width:215px}}

function makeForest(){const rng=()=>{const v=Math.sin(seed++*12.9898)*43758.5453;return v-Math.floor(v);};for(let x=-34;x<=34;x+=5.2)for(let z=-34;z<=34;z+=5.2){if(rng()<.18)continue;const edge=Math.abs(x)>27||Math.abs(z)>27;const kinds=edge?['spruce','spruce','larch']:['spruce','birch','pine','spruce'];tree(x+(rng()-.5)*3,z+(rng()-.5)*3,kinds[Math.floor(rng()*kinds.length)],.65+rng()*.52,Math.floor(rng()*9));}}
function yearToZ(year){const v=Math.max(1950,Math.min(2026,year));for(let i=0;i<timelineYears.length-1;i++){if(v<=timelineYears[i+1]){const f=(v-timelineYears[i])/(timelineYears[i+1]-timelineYears[i]);return(34-(i+f)/(timelineYears.length-1)*68)*TIME_STRETCH;}}return-34*TIME_STRETCH;}
function groundLabel(element,x,z,scale,rotation=0){const o=new CSS3DObject(element);o.rotation.x=-Math.PI/2;o.rotation.z=rotation;o.scale.setScalar(scale);o.position.set(x,.04,z);labelScene.add(o);}
function makeTimeline(){timelineYears.forEach(year=>{const el=document.createElement('div');el.className='year';el.textContent=year;groundLabel(el,44,yearToZ(year),.035);});}
function makeBands(){bands.forEach(b=>{const el=document.createElement('div');el.className='band-title';b.lines.forEach((s,i)=>{if(i)el.appendChild(document.createElement('br'));el.appendChild(document.createTextNode(s));});groundLabel(el,b.x,46*TIME_STRETCH,.025,Math.PI/2);});[-12,12].forEach(x=>{const el=document.createElement('div');el.style.cssText='width:1px;height:'+2720*TIME_STRETCH+'px;background:rgba(70,80,70,.18)';groundLabel(el,x,0,.025);});}
scene.add(new THREE.HemisphereLight(0xd8ebff,0x25372d,2.2));const sun=new THREE.DirectionalLight(0xffe6bd,3.1);sun.position.set(-25,40,18);scene.add(sun);
const ns='http://www.w3.org/2000/svg';
function svg(name,attrs={}){const n=document.createElementNS(ns,name);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,String(v));return n;}
const markers=[];const byId=new Map();let lastOpenedPin=null;
// Collegamenti ripresi dai fili rossi della timeline fornita.
// Le coppie sono simmetriche; si mostrano i vicini diretti del pin attivo.
const eventConnections = [
  ['event-3', 'event-20'],   // Google in Asia — pausa di Singapore
  ['event-7', 'event-20'],   // Singapore green — pausa di Singapore
  ['event-5', 'event-14'],   // AWS in Africa — Day Zero
  ['event-13', 'event-21'],  // Megasiccità cilena — Cerrillos
  ['event-15', 'event-23'],  // Siccità in Uruguay — Canelones
  ['event-17', 'event-25']   // Disboscamento — sospensione Google
];
const connectionLayer=svg('g',{'aria-hidden':'true',class:'connection-layer'});
overlay.append(connectionLayer);
const connectionLines=eventConnections.map(([from,to])=>{
  const line=svg('line',{class:'event-link','data-from':from,'data-to':to});
  line.style.display='none';connectionLayer.append(line);
  return {from,to,line};
});
const linkedTooltips=new Map();
let previewIds=new Set();
function connectedIds(id){
  const ids=new Set(id?[id]:[]);
  for(const [a,b] of eventConnections){if(a===id)ids.add(b);if(b===id)ids.add(a);}
  return ids;
}
function getLinkedTooltip(id){
  if(linkedTooltips.has(id))return linkedTooltips.get(id);
  const card=document.createElement('div');card.className='event-tooltip linked-tooltip';
  card.setAttribute('role','tooltip');card.hidden=true;
  const year=document.createElement('div');year.className='tooltip-year';
  const title=document.createElement('div');title.className='tooltip-title';
  card.append(year,title);document.body.appendChild(card);
  const item={card,year,title};linkedTooltips.set(id,item);return item;
}
function syncFocus(){
  const preview=hoveredId||focusedId;
  previewIds=connectedIds(preview);
  container.classList.toggle('has-focus',Boolean(preview||selectedId));
  for(const m of markers){
    const isMain=m.event.id===preview;
    const related=previewIds.has(m.event.id);
    const active=related||m.event.id===selectedId;
    m.dot.setAttribute('r',isMain?7:active?6:5);
    m.dot.setAttribute('stroke',active?'#56656b':'#fff');
    m.halo.style.opacity=active?'0.6':'0';
    m.group.style.opacity=preview&&!related?'.4':'1';
    m.hit.setAttribute('aria-expanded',String(m.event.id===selectedId));
  }
  for(const item of linkedTooltips.values())item.card.hidden=true;
  tooltip.hidden=!preview;
  if(preview){
    const m=byId.get(preview);
    tooltip.style.setProperty('--band-color',bands[m.event.band].color);
    document.querySelector('#tooltip-year').textContent=m.event.date;
    document.querySelector('#tooltip-title').textContent=m.event.short;
    for(const id of previewIds){
      if(id===preview)continue;
      const neighbor=byId.get(id),item=getLinkedTooltip(id);
      item.year.textContent=neighbor.event.date;item.title.textContent=neighbor.event.short;
      item.card.style.setProperty('--band-color',bands[neighbor.event.band].color);
      item.card.hidden=false;
    }
  }
  updateConnections();
}
function updateConnections(){
  const preview=hoveredId||focusedId;
  for(const edge of connectionLines){
    const a=byId.get(edge.from),b=byId.get(edge.to);
    const show=preview&&(edge.from===preview||edge.to===preview)&&a&&b&&a.visible&&b.visible;
    edge.line.style.display=show?'':'none';
    if(!show)continue;
    const dx=b.screenX-a.screenX,dy=b.screenY-a.screenY;
    const length=Math.hypot(dx,dy)||1,trim=Math.min(8,length/2);
    edge.line.setAttribute('x1',a.screenX+dx/length*trim);
    edge.line.setAttribute('y1',a.screenY+dy/length*trim);
    edge.line.setAttribute('x2',b.screenX-dx/length*trim);
    edge.line.setAttribute('y2',b.screenY-dy/length*trim);
  }
  layoutTooltips(preview);
}
function layoutTooltips(preview){
  if(!preview)return;
  const occupied=[],padding=12,gap=15;
  if(!panel.hidden){const r=panel.getBoundingClientRect();occupied.push({x:r.left,y:r.top,w:r.width,h:r.height});}
  for(const id of previewIds){
    const marker=byId.get(id),card=id===preview?tooltip:linkedTooltips.get(id).card;
    card.hidden=!marker.visible;
    if(!marker.visible)continue;
    const rect=card.getBoundingClientRect(),w=rect.width,h=rect.height;
    const px=marker.screenX,py=marker.screenY;
    const candidates=[
      [px+gap,py-h/2],[px-w-gap,py-h/2],
      [px-w/2,py-h-gap],[px-w/2,py+gap],
      [px+gap,py-h-gap],[px-w-gap,py-h-gap],
      [px+gap,py+gap],[px-w-gap,py+gap]
    ];
    const boxes=candidates.map(([x,y])=>({x:Math.max(padding,Math.min(viewportWidth-w-padding,x)),y:Math.max(padding,Math.min(viewportHeight-h-padding,y)),w,h}));
    const overlap=box=>occupied.reduce((sum,b)=>sum+Math.max(0,Math.min(box.x+w+6,b.x+b.w)-Math.max(box.x-6,b.x))*Math.max(0,Math.min(box.y+h+6,b.y+b.h)-Math.max(box.y-6,b.y)),0);
    let chosen=boxes[0],score=overlap(chosen);
    for(const box of boxes.slice(1)){const next=overlap(box);if(next<score){chosen=box;score=next;}if(score===0)break;}
    card.style.transform='translate('+chosen.x+'px,'+chosen.y+'px)';occupied.push(chosen);
  }
}
function openEvent(m){const e=m.event,b=bands[e.band];selectedId=e.id;lastOpenedPin=m.hit;panel.style.setProperty('--band-color',b.color);document.querySelector('#detail-band').textContent=b.title;document.querySelector('#detail-date').textContent=e.date+' · '+e.place;document.querySelector('#detail-title').textContent=e.title;const text=document.querySelector('#detail-text');text.textContent=e.description;text.hidden=!e.description;const figure=document.querySelector('#detail-figure'),image=document.querySelector('#detail-image');figure.hidden=!e.image;if(e.image){image.src=e.image;image.alt=e.title;}else{image.removeAttribute('src');image.alt='';}panel.hidden=false;panel.scrollTop=0;hoveredId=null;focusedId=null;syncFocus();closeButton.focus({preventScroll:true});}
function closeEvent(restoreFocus=true){panel.hidden=true;selectedId=null;hoveredId=null;focusedId=null;if(restoreFocus&&lastOpenedPin)lastOpenedPin.focus({preventScroll:true});syncFocus();}
closeButton.addEventListener('click',()=>closeEvent());window.addEventListener('keydown',e=>{if(e.key==='Escape'){closeEvent(false);if(document.activeElement?.classList?.contains('pin-hit'))document.activeElement.blur();syncFocus();}});
function makeEvents(){const count=[0,0,0];for(const event of ecologicalEvents){const index=count[event.band]++,band=bands[event.band];const x=band.x+[-5,0,5][index%3],z=yearToZ(event.year),height=band.height;const group=svg('g',{class:'pin-group','data-event-id':event.id});const halo=svg('circle',{class:'pin-halo',r:10,stroke:band.color});const dot=svg('circle',{class:'pin-dot',r:5,fill:band.color});const hit=svg('circle',{class:'pin-hit',r:14,fill:'transparent',tabindex:0,role:'button','aria-label':event.date+' — '+event.short,'aria-controls':'event-detail','aria-expanded':'false','aria-describedby':'event-tooltip'});group.append(halo,dot,hit);overlay.append(group);const m={event,group,halo,dot,hit,top:new THREE.Vector3(x,height,z),screenX:0,screenY:0};markers.push(m);byId.set(event.id,m);hit.addEventListener('pointerdown',e=>e.stopPropagation());hit.addEventListener('click',e=>{e.stopPropagation();openEvent(m);});hit.addEventListener('pointerenter',e=>{if(e.pointerType==='touch'||dragging)return;hoveredId=event.id;focusedId=null;syncFocus();});hit.addEventListener('pointerleave',()=>{if(hoveredId===event.id)hoveredId=null;syncFocus();});hit.addEventListener('focus',()=>{focusedId=event.id;syncFocus();});hit.addEventListener('blur',()=>{if(focusedId===event.id)focusedId=null;syncFocus();});hit.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openEvent(m);}});}}
const pTop=new THREE.Vector3();
function updateEvents(){overlay.setAttribute('viewBox','0 0 '+viewportWidth+' '+viewportHeight);for(const m of markers){pTop.copy(m.top).project(camera);const visible=pTop.z>=-1&&pTop.z<=1;m.visible=visible;m.group.style.display=visible?'':'none';if(!visible)continue;const tx=(pTop.x+1)*viewportWidth/2,ty=(1-pTop.y)*viewportHeight/2;m.screenX=tx;m.screenY=ty;for(const n of[m.halo,m.dot,m.hit]){n.setAttribute('cx',tx);n.setAttribute('cy',ty);}}updateConnections();}
function updateProjection(){const aspect=viewportWidth/viewportHeight,half=Math.max(43,62/aspect)*(distance/105);camera.left=-half*aspect;camera.right=half*aspect;camera.top=half;camera.bottom=-half;camera.updateProjectionMatrix();}
function resize(){viewportWidth=Math.max(1,container.clientWidth);viewportHeight=Math.max(1,container.clientHeight);renderer.setSize(Math.max(1,Math.floor(viewportWidth*.62)),Math.max(1,Math.floor(viewportHeight*.62)),false);labelRenderer.setSize(viewportWidth,viewportHeight);updateProjection();}
function animate(){requestAnimationFrame(animate);camera.position.set(target.x+Math.sin(yaw)*Math.cos(pitch)*120,target.y+Math.sin(pitch)*120,target.z+Math.cos(yaw)*Math.cos(pitch)*120);camera.lookAt(target);renderer.render(scene,camera);labelRenderer.render(labelScene,camera);updateEvents();}
container.addEventListener('pointerdown',e=>{if(e.button!==0)return;dragging=true;hoveredId=null;focusedId=null;syncFocus();lastX=e.clientX;lastY=e.clientY;container.classList.add('dragging');container.setPointerCapture(e.pointerId);});
function stopDragging(){dragging=false;container.classList.remove('dragging');}
for(const type of['pointerup','pointercancel','lostpointercapture'])container.addEventListener(type,stopDragging);
container.addEventListener('pointermove',e=>{if(!dragging)return;yaw-=(e.clientX-lastX)*.006;pitch=Math.max(.18,Math.min(1.35,pitch+(e.clientY-lastY)*.006));lastX=e.clientX;lastY=e.clientY;});
container.addEventListener('wheel',e=>{e.preventDefault();distance=Math.max(45,Math.min(260,distance+e.deltaY*.035));updateProjection();},{passive:false});
window.addEventListener('resize',resize);
makeForest();makeTimeline();makeBands();makeEvents();resize();animate();
} catch(error) {console.error(error);const box=document.querySelector('#load-error');box.hidden=false;box.textContent='Impossibile caricare la scena 3D. Verifica che il browser possa accedere a unpkg.com e ricarica la pagina. Dettaglio: '+error.message;}
